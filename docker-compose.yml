services:
  client:
    build:
      context: .
      dockerfile: src/BillingManagement.Client/Dockerfile
    ports:
      - "5080:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: src/BillingManagement.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BillingManagement;User Id=sa;Password=${BMS_DB_PASSWORD:-Billing_dev_2026!};TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "5081:8080"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8080/health/ready
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrator:
        condition: service_completed_successfully

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${BMS_DB_PASSWORD:-Billing_dev_2026!}"
    ports:
      - "14333:1433"
    volumes:
      - billingmanagement-sqlserver:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrator:
    build:
      context: .
      dockerfile: src/BillingManagement.Migrator/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BillingManagement;User Id=sa;Password=${BMS_DB_PASSWORD:-Billing_dev_2026!};TrustServerCertificate=True;MultipleActiveResultSets=True"
      LegacyCompanyMedia__RootPath: /var/lib/billing-management/company-media
    volumes:
      - billingmanagement-company-media:/var/lib/billing-management/company-media:ro
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  billingmanagement-company-media:
  billingmanagement-sqlserver:
